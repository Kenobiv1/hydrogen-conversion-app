<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogen Conversion App</title>
    <!-- Link to Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header with Theme Toggle -->
        <div class="header">
            <h1>Hydrogen Conversion App</h1>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" aria-label="Toggle Dark Mode" role="switch" />
                    <!-- Slider with Integrated Icon -->
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <!-- Converter Section -->
        <div class="converter">
            <label for="inputValue">Enter Value:</label>
            <input type="number" id="inputValue" placeholder="Enter value">
            
            <label for="inputUnit">From:</label>
            <select id="inputUnit">
                <option value="kg_per_hr">kg/hr</option>
                <option value="nm3_per_hr">nm³/hr</option>
            </select>
            
            <button id="convertBtn">Convert</button>
        </div>

        <!-- Results Section -->
        <div class="results">
            <h2>Results:</h2>
            <p id="resultVolume"></p>
            <p id="resultGallons"></p>
            <p id="resultEnergyBTU"></p>
            <p id="resultEnergyJoules"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
