<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogen Conversion App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Hydrogen Conversion App</h1>
        <div class="converter">
            <label for="inputValue">Enter Value:</label>
            <input type="number" id="inputValue" placeholder="Enter value">
            
            <label for="inputUnit">From:</label>
            <select id="inputUnit">
                <option value="kg_per_hr">kg/hr</option>
                <option value="nm3_per_hr">nm³/hr</option>
            </select>
            
            <button id="convertBtn">Convert</button>
        </div>
        <div class="results">
            <h2>Results:</h2>
            <p id="resultVolume"></p>
            <p id="resultGallons"></p>
            <p id="resultEnergyBTU"></p>
            <p id="resultEnergyJoules"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
